{{ define "main" }}
<article class="content-page glass">
  <h1>{{ .Title }}</h1>
  {{ if not .Date.IsZero }}<div class="meta">{{ .Date.Format "January 2, 2006" }}</div>{{ end }}
  <div class="content">
    {{ .Content }}
  </div>
  
  <div style="margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--glass-border); text-align: center;">
    <a href="{{ .Parent.RelPermalink }}" class="btn btn-outline" style="display: inline-block; padding: 0.6rem 1.2rem; font-size: 0.95rem;">
      &larr; Back to {{ .Parent.Title }}
    </a>
  </div>
</article>
{{ end }}
