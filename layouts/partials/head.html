<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  
  {{ $style := resources.Get "css/main.css" | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">
  
  {{ $theme := resources.Get "js/theme.js" | resources.Minify | resources.Fingerprint }}
  <script src="{{ $theme.RelPermalink }}"></script>
  
  {{ $particles := resources.Get "js/particles.js" | resources.Minify | resources.Fingerprint }}
  <script src="{{ $particles.RelPermalink }}"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
